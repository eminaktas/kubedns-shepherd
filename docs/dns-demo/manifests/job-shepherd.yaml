apiVersion: batch/v1
kind: Job
metadata:
  name: dns-loadgen-shepherd
  namespace: dns-ndots-shepherd
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dns-loadgen
        app.kubernetes.io/part-of: kubedns-shepherd-dns-demo
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      dnsPolicy: ClusterFirst
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loadgen
          image: DNS_LOADGEN_IMAGE
          imagePullPolicy: Never
          env:
            - name: TARGET
              value: __TARGET__
            - name: QUERIES
              value: "__QUERIES__"
            - name: CONCURRENCY
              value: "1"
            - name: GODEBUG
              value: netdns=go
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
